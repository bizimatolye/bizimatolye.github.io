<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Atölye</title>
<meta name="theme-color" content="#0B1311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atölye">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== TEMALAR ===================== */
:root, [data-tema="zumrut"]{
  --bg:#0B1311; --s1:#101C19; --s2:#172824; --s3:#1E332E;
  --cizgi:rgba(167,243,208,.12); --yazi:#E6F2EE; --soluk:#90AAA1; --soluk2:#6F8981;
  --vurgu:#34D399; --vurgu-yazi:#04241A; --vurgu-zayif:rgba(52,211,153,.16); --vurgu-zayif-yazi:#BDF5DF;
  --benim:#0D7356; --benim-yazi:#FFFFFF; --diger:#172824; --diger-kenar:transparent; --diger-yazi:#E6F2EE;
  --avatar:linear-gradient(135deg,#FBBF24,#F59E0B); --avatar-yazi:#2A1A02;
  --karo:rgba(52,211,153,.14); --karo-yazi:#A7F3D0;
  --cevrimici:#34D399; --tehlike:#F87171; --tehlike-zayif:rgba(248,113,113,.12);
  --ust-bg:rgba(11,19,17,.86); --panel:#122019; --perde:rgba(0,0,0,.6); --golge:0 14px 34px -12px rgba(0,0,0,.6);
  --st-fikir:#7DD3FC; --st-devam:#34D399; --st-bekliyor:#FBBF24; --st-bitti:#94A3B8;
  --ipucu:rgba(52,211,153,.08); --ipucu-kenar:rgba(52,211,153,.25);
  --demo:rgba(251,191,36,.08); --demo-kenar:rgba(251,191,36,.25);
  color-scheme:dark;
}
[data-tema="gunisigi"]{
  --bg:#F5F3EF; --s1:#FFFFFF; --s2:#ECE8E1; --s3:#E4DFD6;
  --cizgi:#E2DCD2; --yazi:#1C1B19; --soluk:#625C53; --soluk2:#7A7369;
  --vurgu:#C2410C; --vurgu-yazi:#FFFFFF; --vurgu-zayif:#1C1B19; --vurgu-zayif-yazi:#FFFFFF;
  --benim:#C2410C; --benim-yazi:#FFFFFF; --diger:#FFFFFF; --diger-kenar:#E2DCD2; --diger-yazi:#1C1B19;
  --avatar:linear-gradient(135deg,#1C1B19,#4B463F); --avatar-yazi:#FFFFFF;
  --karo:#F3E2D7; --karo-yazi:#9A3412;
  --cevrimici:#059669; --tehlike:#B91C1C; --tehlike-zayif:#FBE9E7;
  --ust-bg:rgba(245,243,239,.9); --panel:#FFFFFF; --perde:rgba(28,27,25,.35); --golge:0 14px 34px -14px rgba(60,40,20,.35);
  --st-fikir:#2563EB; --st-devam:#059669; --st-bekliyor:#B45309; --st-bitti:#64748B;
  --ipucu:#FFF7ED; --ipucu-kenar:#FED7AA;
  --demo:#FFFBEB; --demo-kenar:#FDE68A;
  color-scheme:light;
}
:root{ --r:20px; --ust:env(safe-area-inset-top); --alt:env(safe-area-inset-bottom);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --baslik-font:"Space Grotesk",Inter,-apple-system,"Segoe UI",sans-serif; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font:15px/1.45 var(--font);overscroll-behavior:none;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--vurgu)}
.gizli{display:none!important}
[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* ---------- ortak ---------- */
.ust{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:calc(var(--ust) + 14px) 16px 12px;background:var(--ust-bg);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--cizgi)}
.ust h1{font:700 30px/1.1 var(--baslik-font);margin:0;letter-spacing:-.02em}
.ust .alt-baslik{font-size:13px;color:var(--soluk);margin-top:2px}
.ust .bosluk{flex:1;min-width:0}
.ikon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--cizgi);color:var(--yazi);flex:none}
.ikon-btn:active{transform:scale(.94)}
.ikon-btn svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:16px;font-weight:650;background:var(--vurgu);color:var(--vurgu-yazi)}
.btn:disabled{opacity:.55}
.btn.ikincil{background:var(--s2);color:var(--yazi);border:1px solid var(--cizgi)}
.btn.tehlike{background:var(--tehlike-zayif);color:var(--tehlike);border:1px solid var(--tehlike-zayif)}
.btn.tam{width:100%}
.alan{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.alan label{font-size:12.5px;color:var(--soluk);font-weight:600;letter-spacing:.02em}
.girdi{width:100%;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--cizgi);outline:none;font-size:16px;color:var(--yazi)}
.girdi::placeholder{color:var(--soluk2)}
.girdi:focus{border-color:var(--vurgu)}
textarea.girdi{resize:vertical;min-height:80px}
.kaydir{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.durum-nokta{width:8px;height:8px;border-radius:50%;flex:none}
.rozet{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--vurgu);color:var(--vurgu-yazi);font-size:12px;font-weight:700;display:grid;place-items:center}

/* ---------- giriş ---------- */
.giris{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(var(--alt) + 32px)}
.logo{width:72px;height:72px;border-radius:22px;margin-bottom:22px;background:url(icons/icon-192.png) center/cover;box-shadow:var(--golge)}
.giris h2{font:700 34px/1.1 var(--baslik-font);margin:0 0 8px;letter-spacing:-.03em}
.giris p{color:var(--soluk);margin:0 0 28px}
.kart{background:var(--s1);border:1px solid var(--cizgi);border-radius:var(--r);padding:20px}
.hata{color:var(--tehlike);font-size:13.5px;min-height:20px;margin:-4px 0 10px}
.demo-not{margin-top:18px;font-size:13px;color:var(--soluk);background:var(--demo);border:1px solid var(--demo-kenar);padding:10px 12px;border-radius:12px}

/* ---------- proje listesi ---------- */
.arac{padding:12px 16px 4px;display:flex;flex-direction:column;gap:12px}
.ara{position:relative}
.ara svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--soluk)}
.ara .girdi{padding-left:42px;height:46px;font-size:15px;border-radius:16px}
.filtreler{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtreler::-webkit-scrollbar{display:none}
.filtre{height:34px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--cizgi);font-size:13px;font-weight:600;color:var(--soluk);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.filtre.secili{background:var(--vurgu-zayif);border-color:transparent;color:var(--vurgu-zayif-yazi)}
.liste{padding:8px 14px 96px;display:flex;flex-direction:column;gap:10px}
.proje{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--cizgi);color:var(--yazi);transition:transform .12s}
.proje:active{transform:scale(.985);background:var(--s2)}
.proje-ikon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font:700 19px var(--baslik-font);flex:none;background:var(--karo);color:var(--karo-yazi)}
.proje-orta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.proje-ust{display:flex;align-items:center;gap:8px}
.proje-ad{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.proje-zaman{font-size:12px;color:var(--soluk);flex:none}
.proje-alt{display:flex;align-items:center;gap:8px}
.proje-durum{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;flex:none}
.proje-son{font-size:13.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.proje.okunmamis .proje-son{color:var(--yazi)}
.bos{text-align:center;color:var(--soluk);padding:60px 24px}
.bos .buyuk{font-size:44px;margin-bottom:10px}
.fab{position:absolute;right:20px;bottom:calc(var(--alt) + 88px);z-index:6;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:var(--vurgu);color:var(--vurgu-yazi);box-shadow:var(--golge)}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.93)}
.ipucu{margin:10px 16px 0;padding:11px 13px;border-radius:14px;font-size:13px;color:var(--yazi);background:var(--ipucu);border:1px solid var(--ipucu-kenar);display:flex;gap:10px;align-items:flex-start}
.ipucu button{margin-left:auto;color:var(--soluk);font-size:18px;line-height:1}

/* ---------- alt sekmeler ---------- */
.sekmeler{display:flex;gap:8px;border-top:1px solid var(--cizgi);background:var(--s1);padding:8px 12px calc(var(--alt) + 8px)}
.sekme{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:12px;font-weight:600;color:var(--soluk);position:relative;border-radius:16px;transition:background .15s,color .15s}
.sekme svg{width:24px;height:24px}
.sekme.secili{color:var(--yazi);background:var(--vurgu-zayif)}
.sekme.secili svg{color:var(--vurgu)}
[data-tema="gunisigi"] .sekme.secili{color:var(--vurgu-zayif-yazi)}
[data-tema="gunisigi"] .sekme.secili svg{color:#FDBA74}
.sekme .rozet{position:absolute;top:2px;left:calc(50% + 8px);min-width:20px;height:20px;font-size:11px;padding:0 6px}
body.klavye .sekmeler{display:none}
.yazma.sekmeli{padding-bottom:10px}
body.klavye .yazma.sekmeli{padding-bottom:calc(var(--alt) + 10px)}

/* ---------- sohbet ---------- */
.sohbet-baslik{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--yazi)}
.sohbet-baslik b{font:700 18px/1.2 var(--baslik-font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sohbet-baslik span{font-size:13px;color:var(--soluk);display:flex;align-items:center;gap:6px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--baslik-font);flex:none;position:relative;background:var(--avatar);color:var(--avatar-yazi)}
.avatar.cevrimici::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--cevrimici);border:2.5px solid var(--bg)}
.durum-yazi{font-size:13px;color:var(--soluk)}
.durum-yazi.canli{color:var(--cevrimici);font-weight:500}
.yaziyor-nokta{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.yaziyor-nokta i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:zipla 1s infinite}
.yaziyor-nokta i:nth-child(2){animation-delay:.15s}.yaziyor-nokta i:nth-child(3){animation-delay:.3s}
@keyframes zipla{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
.mesajlar{padding:12px 14px;display:flex;flex-direction:column}
.gun{align-self:center;font-size:12px;font-weight:600;color:var(--soluk);background:var(--s2);padding:5px 12px;border-radius:999px;margin:14px 0 8px}
.m{max-width:80%;display:flex;flex-direction:column;margin-top:8px;align-self:flex-start;user-select:text;-webkit-user-select:text;-webkit-touch-callout:none}
.m.devam{margin-top:3px}
.m.benim{align-self:flex-end;align-items:flex-end}
.m .kim{font-size:12px;font-weight:700;color:var(--vurgu);margin:0 0 3px 12px}
.balon{padding:10px 14px 8px;border-radius:20px;background:var(--diger);border:1px solid var(--diger-kenar);color:var(--diger-yazi);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;position:relative;font-size:15px;line-height:1.4}
.m:not(.benim) .balon{border-bottom-left-radius:6px}
.m.benim .balon{background:var(--benim);border-color:transparent;color:var(--benim-yazi);border-bottom-right-radius:6px}
.m.benim .balon a{color:var(--benim-yazi)}
.m .zaman{font-size:11px;opacity:.7;margin-left:10px;float:right;margin-top:6px;white-space:nowrap}
.m.gonderiliyor{opacity:.6}
.gorsel{display:block;max-width:100%;width:260px;max-height:320px;object-fit:cover;border-radius:14px;margin:2px -6px 6px;background:var(--s2);min-height:120px;cursor:zoom-in}
.dosya{display:flex;align-items:center;gap:12px;padding:6px 4px;margin:0 -4px 6px;text-decoration:none;color:inherit;min-width:210px}
.dosya .di{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--karo);color:var(--karo-yazi);flex:none;font-size:11px;font-weight:800}
.m.benim .dosya .di{background:rgba(255,255,255,.18);color:#fff}
.dosya b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.dosya small{opacity:.75;font-size:12px}
.yazma{border-top:1px solid var(--cizgi);background:var(--bg);padding:10px 12px calc(var(--alt) + 10px)}
.yazma-satir{display:flex;align-items:flex-end;gap:8px}
.yazma textarea{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 16px;border-radius:22px;background:var(--s1);border:1px solid var(--cizgi);outline:none;font-size:16px;line-height:1.35;color:var(--yazi)}
.yazma textarea::placeholder{color:var(--soluk2)}
.yazma textarea:focus{border-color:var(--vurgu)}
.gonder{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--vurgu-yazi);background:var(--vurgu)}
[data-tema="zumrut"] .gonder,:root:not([data-tema]) .gonder{background:var(--benim);color:#fff}
.gonder:disabled{opacity:.4}
.gonder svg,.ekle svg{width:20px;height:20px}
.ekle{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--s1);border:1px solid var(--cizgi);color:var(--yazi)}
.ek-onizleme{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:14px;background:var(--s1);border:1px solid var(--cizgi);font-size:13.5px}
.ek-onizleme img{width:44px;height:44px;object-fit:cover;border-radius:10px}
.ek-onizleme .ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donen{width:18px;height:18px;border:2.5px solid rgba(127,127,127,.35);border-top-color:currentColor;border-radius:50%;animation:don .8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}

/* ---------- alt panel ---------- */
.perde{position:fixed;inset:0;z-index:20;background:var(--perde);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:belir .18s ease}
.panel{width:100%;max-width:760px;max-height:92dvh;overflow-y:auto;background:var(--panel);color:var(--yazi);border:1px solid var(--cizgi);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(var(--alt) + 22px);animation:yuksel .24s cubic-bezier(.2,.9,.3,1)}
.panel .tutamak{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.panel h3{margin:0 0 16px;font:700 21px var(--baslik-font)}
.panel h4{margin:22px 0 10px;font-size:12px;color:var(--soluk);text-transform:uppercase;letter-spacing:.08em}
@keyframes belir{from{opacity:0}}
@keyframes yuksel{from{transform:translateY(40px);opacity:.4}}
.secim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.secim button{padding:10px 4px;border-radius:12px;background:var(--s1);border:1px solid var(--cizgi);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--soluk)}
.secim button.secili{color:var(--yazi);border-color:var(--renk);background:color-mix(in srgb,var(--renk) 14%,transparent)}
.link-satir{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--cizgi);margin-bottom:6px}
.link-satir a{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.link-satir button{color:var(--soluk);font-size:20px;line-height:1;padding:0 4px}
.iki{display:flex;gap:8px}
.iki .girdi{min-width:0}
.menu-satir{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--cizgi);margin-bottom:8px;text-align:left;font-weight:600;color:var(--yazi)}
.menu-satir small{display:block;font-weight:400;color:var(--soluk);font-size:12.5px}
.menu-satir svg{width:20px;height:20px;flex:none}
.dosya-liste a{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--cizgi);text-decoration:none;color:var(--yazi);font-size:14px}
.dosya-liste a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dosya-liste small{color:var(--soluk)}

/* ---------- tema seçici ---------- */
.tema-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tema-kart{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:18px;border:2px solid var(--cizgi);background:var(--s1);text-align:left;color:var(--yazi)}
.tema-kart.secili{border-color:var(--vurgu)}
.tema-kart b{font-size:14px;display:flex;align-items:center;justify-content:space-between}
.tema-onizleme{height:86px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.tema-onizleme i{display:block;height:14px;border-radius:7px}

/* ---------- bildirim / büyük görsel ---------- */
#tost{position:fixed;left:50%;top:calc(var(--ust) + 12px);transform:translate(-50%,-150%);z-index:40;max-width:min(92vw,520px);padding:12px 16px;border-radius:16px;background:var(--panel);color:var(--yazi);border:1px solid var(--cizgi);font-size:14px;font-weight:550;box-shadow:var(--golge);transition:transform .3s cubic-bezier(.2,.9,.3,1);cursor:pointer}
#tost.acik{transform:translate(-50%,0)}
.buyut{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.buyut img{max-width:100%;max-height:100%;border-radius:8px}
@media (min-width:780px){ #app{border-left:1px solid var(--cizgi);border-right:1px solid var(--cizgi)} }
</style>
<script>
// Tema, sayfa çizilmeden önce uygulanır (ekran yanıp sönmesin)
(function(){ try { var t = localStorage.getItem('tema') || 'zumrut'; document.documentElement.setAttribute('data-tema', t);
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'gunisigi' ? '#F5F3EF' : '#0B1311'; } catch(e) {} })();
</script>

</head>
<body>
<div id="app"></div>
<div id="tost"></div>
<script src="config.js"></script>
<script type="module">
// =====================================================================
//  ATÖLYE — iki kişilik özel proje + mesajlaşma uygulaması
// =====================================================================
const AYAR = window.ATOLYE_AYAR || {};
const DEMO = !AYAR.SUPABASE_URL || !AYAR.SUPABASE_ANON_KEY;
// Davet / şifre sıfırlama e-postasındaki linkten gelindi mi? (Supabase bilgileri URL'nin # kısmına koyar)
const LINK = new URLSearchParams(location.hash.slice(1));
const LINK_TURU = LINK.get('type');                       // 'invite' | 'recovery' | ...
const LINK_HATA = LINK.get('error_description') || LINK.get('error');
const app = document.getElementById('app');

// ---------- küçük yardımcılar ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkle = s => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const saat = t => new Date(t).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
const gunAnahtar = t => new Date(t).toDateString();
function kisaZaman(t){
  if (!t) return '';
  const d = new Date(t), n = new Date(), dun = new Date(n); dun.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return saat(t);
  if (d.toDateString() === dun.toDateString()) return 'Dün';
  if (n - d < 6 * 864e5) return d.toLocaleDateString('tr-TR', { weekday:'short' });
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'short' });
}
function gunBaslik(t){
  const d = new Date(t), n = new Date(), dun = new Date(n); dun.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return 'Bugün';
  if (d.toDateString() === dun.toDateString()) return 'Dün';
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric', weekday:'long' });
}

async function supabaseKatmani(){
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(AYAR.SUPABASE_URL, AYAR.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  const urlOnbellek = new Map();
  let kanal = null;
  const v = r => { if (r.error) throw r.error; return r.data; };
  return {
    async oturum(){ const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async girisYap(email, sifre){ const r = await sb.auth.signInWithPassword({ email, password: sifre }); if (r.error) throw r.error; return r.data.user; },
    async cikis(){ await sb.auth.signOut(); },
    async sifreBelirle(sifre){ const r = await sb.auth.updateUser({ password: sifre }); if (r.error) throw r.error; },
    async sifreSifirla(email){ const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (r.error) throw r.error; },
    oturumDegisti(cb){ sb.auth.onAuthStateChange((olay, s) => cb(olay, s?.user || null)); },
    async uyeler(){ return v(await sb.from('uyeler').select('*')); },
    async projeler(){ return v(await sb.from('proje_ozet').select('*')); },
    async projeEkle(p){ return v(await sb.from('projeler').insert(p).select().single()); },
    async projeGuncelle(id, p){ return v(await sb.from('projeler').update({ ...p, guncelleme: new Date().toISOString() }).eq('id', id).select().single()); },
    async projeSil(id){
      const ekler = v(await sb.from('mesajlar').select('dosya_yolu').eq('proje_id', id).not('dosya_yolu', 'is', null));
      if (ekler.length) await sb.storage.from('dosyalar').remove(ekler.map(e => e.dosya_yolu));
      v(await sb.from('projeler').delete().eq('id', id));
    },
    async mesajlar(projeId){
      const d = v(await sb.from('mesajlar').select('*').eq('proje_id', projeId).order('olusturma', { ascending:false }).limit(300));
      return d.reverse();
    },
    async mesajGonder(projeId, metin, dosya){
      let ek = {};
      if (dosya){
        const temiz = dosya.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80) || 'dosya';
        const yol = `${projeId}/${Date.now()}-${temiz}`;
        v(await sb.storage.from('dosyalar').upload(yol, dosya, { contentType: dosya.type || 'application/octet-stream' }));
        ek = { dosya_yolu: yol, dosya_adi: dosya.name, dosya_tipi: dosya.type || '', dosya_boyut: dosya.size };
      }
      return v(await sb.from('mesajlar').insert({ proje_id: projeId, metin, ...ek }).select().single());
    },
    async mesajSil(m){
      if (m.dosya_yolu) await sb.storage.from('dosyalar').remove([m.dosya_yolu]);
      v(await sb.from('mesajlar').delete().eq('id', m.id));
    },
    async okundu(projeId){ await sb.rpc('okundu_isaretle', { p_proje: projeId }); },
    async dosyaUrl(yol){
      if (urlOnbellek.has(yol)) return urlOnbellek.get(yol);
      const r = await sb.storage.from('dosyalar').createSignedUrl(yol, 60 * 60 * 6);
      if (r.error) throw r.error;
      urlOnbellek.set(yol, r.data.signedUrl);
      return r.data.signedUrl;
    },
    async dosyalar(projeId){
      return v(await sb.from('mesajlar').select('*').eq('proje_id', projeId).not('dosya_yolu', 'is', null).order('olusturma', { ascending:false }));
    },
    dinle(cb, benId){
      kanal = sb.channel('atolye', { config:{ presence:{ key: benId }, broadcast:{ self:false } } })
        .on('postgres_changes', { event:'*', schema:'public', table:'mesajlar' }, p => cb('mesaj', p))
        .on('postgres_changes', { event:'*', schema:'public', table:'projeler' }, p => cb('proje', p))
        .on('presence', { event:'sync' }, () => cb('varlik', Object.keys(kanal.presenceState())))
        .on('broadcast', { event:'yaziyor' }, ({ payload }) => cb('yaziyor', payload))
        .subscribe(async durum => { if (durum === 'SUBSCRIBED'){ cb('baglandi'); await kanal.track({ zaman: Date.now() }); } });
      return () => sb.removeChannel(kanal);
    },
    yaziyor(projeId, benId){ kanal?.send({ type:'broadcast', event:'yaziyor', payload:{ proje_id: projeId, kim: benId } }); },
    async aboneOl(abonelik){
      const j = abonelik.toJSON();
      v(await sb.from('bildirim_abonelikleri').upsert({ endpoint: j.endpoint, abonelik: j }, { onConflict:'endpoint' }));
    },
  };
}

      <button type="button" id="unuttum" style="display:block;margin:14px auto 0;color:var(--soluk);font-size:13.5px">Şifremi unuttum</button>
    </form>
    ${DEMO ? `<div class="demo-not"><b>Demo modu:</b> config.js boş olduğu için sahte verilerle açıldı. Supabase bilgilerini girince gerçek uygulama çalışır.</div>` : ''}
  </div>`;
  if (LINK_HATA) document.getElementById('giris-hata').textContent = 'E-postadaki link geçersiz ya da süresi dolmuş. Aşağıdan yeni link iste.';
  document.getElementById('unuttum').onclick = () => {
    const h = document.getElementById('giris-hata'); h.style.color = 'var(--soluk)';
    h.textContent = 'Şifreni uygulamayı kuran kişi sıfırlayabilir (Supabase → Authentication → Users). Giriş yaptıktan sonra menüden kendin değiştirebilirsin.';
  };
  document.getElementById('giris-form').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('giris-btn'), h = document.getElementById('giris-hata');
    btn.disabled = true; btn.innerHTML = '<div class="donen"></div>'; h.textContent = '';
    try {
      const ham = document.getElementById('eposta').value.trim();
      const tel = telNormal(ham);
      if (!tel && !ham.includes('@')) throw new Error('Telefon numarasını 05xx xxx xx xx şeklinde yaz.');
      D.ben = await D.api.girisYap(tel ? telKimlik(tel) : ham, document.getElementById('sifre').value);
      await basla();
    } catch (err) { h.textContent = hataMetni(err); btn.disabled = false; btn.textContent = 'Giriş yap'; }
  };
}

  app.innerHTML = `

    <h2>Hoş geldin 👋</h2>

    <form class="kart" id="sifre-form">
      <input type="email" autocomplete="username" value="${esc(D.ben.email)}" hidden>

      <button class="btn tam" id="sifre-btn" type="submit">Şifreyi kaydet ve devam et</button>

}

function sirali(){
  const q = D.arama.trim().toLocaleLowerCase('tr');
  return projelerim()
    .filter(p => D.filtre === 'hepsi' || p.durum === D.filtre)
    .filter(p => !q || p.ad.toLocaleLowerCase('tr').includes(q) || (p.aciklama || '').toLocaleLowerCase('tr').includes(q))
    .sort((a, b) => new Date(b.son_mesaj_zamani || b.guncelleme) - new Date(a.son_mesaj_zamani || a.guncelleme));
}

function cizListe(){
  D.ekran = 'liste'; D.aktif = null;
  const ipucuGoster = iOS && !kurulu && !D.ipucuKapali && !D.api.demo;
  app.innerHTML = `
  <header class="ust">
    <div class="bosluk"><h1>Atölye</h1>
      <div class="alt-baslik" id="liste-alt">${listeAltYazi()}</div></div>
    <button class="ikon-btn" id="menu-btn" aria-label="Menü">${I.menu}</button>
  </header>
  ${ipucuGoster ? `<div class="ipucu">${I.tel.replace('<svg', '<svg width="20" height="20" style="flex:none"')}<div>iPhone'da uygulama gibi kullanmak ve bildirim almak için: Safari'de <b>Paylaş</b> → <b>Ana Ekrana Ekle</b>.</div><button id="ipucu-kapat" aria-label="Kapat">×</button></div>` : ''}
  <div class="arac">
    <div class="ara">${I.ara}<input class="girdi" id="ara" type="search" placeholder="Proje ara" value="${esc(D.arama)}"></div>
    <div class="filtreler">
      ${[['hepsi', 'Tümü', null], ...Object.entries(DURUM).map(([k, v]) => [k, v.ad, v.renk])].map(([k, ad, renk]) => {
        const sayi = k === 'hepsi' ? projelerim().length : projelerim().filter(p => p.durum === k).length;
        return `<button class="filtre ${D.filtre === k ? 'secili' : ''}" data-filtre="${k}">${renk ? `<span class="durum-nokta" style="background:${renk}"></span>` : ''}${ad} <span style="opacity:.6">${sayi}</span></button>`;
      }).join('')}
    </div>
  </div>
  <div class="kaydir"><div class="liste" id="liste"></div></div>
  <button class="fab" id="yeni-btn" aria-label="Yeni proje">${I.arti}</button>
  ${sekmelerHTML('projeler')}`;
  cizListeIcerik();
  sekmeleriBagla();
  document.getElementById('menu-btn').onclick = menuPanel;
  document.getElementById('yeni-btn').onclick = () => projePanel(null);
  document.getElementById('ipucu-kapat')?.addEventListener('click', () => { localStorage.setItem('ipucuKapali', '1'); D.ipucuKapali = true; cizListe(); });
  document.getElementById('ara').oninput = e => { D.arama = e.target.value; cizListeIcerik(); };
  app.querySelectorAll('[data-filtre]').forEach(b => b.onclick = () => { D.filtre = b.dataset.filtre; cizListe(); });
  rozetGuncelle();
}

function cizListeIcerik(){
  const kutu = document.getElementById('liste'); if (!kutu) return;
  const liste = sirali();
  if (!liste.length){
    kutu.innerHTML = projelerim().length
      ? `<div class="bos"><div class="buyuk">🔍</div>Bu filtrede proje yok.</div>`
      : `<div class="bos"><div class="buyuk">🛠️</div><b>Henüz proje yok</b><br>Sağ alttaki <b>+</b> ile ilk projeyi aç.</div>`;
    return;
  }
  kutu.innerHTML = liste.map(p => {
    const d = DURUM[p.durum] || DURUM.devam;
    const son = p.son_mesaj_zamani
      ? `${p.son_gonderen && p.son_gonderen !== benimAdim() ? '' : 'Sen: '}${p.son_mesaj ? esc(p.son_mesaj) : (p.son_dosya ? '📎 ' + esc(p.son_dosya) : '')}`
      : `<span style="opacity:.7">${esc(p.aciklama || 'Henüz mesaj yok')}</span>`;
    return `<button class="proje ${p.okunmamis ? 'okunmamis' : ''}" data-proje="${p.id}">
      <div class="proje-ikon">${esc([...p.ad.trim()][0] || '?').toLocaleUpperCase('tr')}</div>
      <div class="proje-orta">
        <div class="proje-ust"><span class="proje-ad">${esc(p.ad)}</span><span class="proje-zaman">${kisaZaman(p.son_mesaj_zamani || p.guncelleme)}</span></div>
        <div class="proje-alt"><span class="proje-durum" style="color:${d.renk}"><span class="durum-nokta" style="background:${d.renk}"></span>${d.ad}</span><span class="proje-son">${son}</span>${p.okunmamis ? `<span class="rozet">${p.okunmamis}</span>` : ''}</div>
      </div></button>`;
  }).join('');
  kutu.querySelectorAll('[data-proje]').forEach(b => b.onclick = () => projeAc(b.dataset.proje));
}

let listeZaman;
function listeYenile(){
  clearTimeout(listeZaman);
  listeZaman = setTimeout(async () => {
    try {
      D.projeler = await D.api.projeler();
      D.dm = D.projeler.find(p => p.ozel) || D.dm;
      if (D.ekran === 'dm' && D.dm) D.aktif = D.dm;
      if (D.ekran === 'liste'){ cizListeIcerik(); const a = document.getElementById('liste-alt'); if (a) a.textContent = listeAltYazi(); }
      sekmeRozetleri();
      rozetGuncelle();
    } catch (e) { console.warn(e); }
  }, 250);
}
function listeAltYazi(){
  const n = projelerim().reduce((t, p) => t + (p.okunmamis || 0), 0);
  return `${projelerim().length} proje${n ? ` · ${n} yeni mesaj` : ''}${D.api.demo ? ' · demo' : ''}`;
}
function rozetGuncelle(){
  const n = D.projeler.reduce((t, p) => t + (p.okunmamis || 0), 0);
  document.title = n ? `(${n}) Atölye` : 'Atölye';
  try { n ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.(); } catch {}
}

// =====================================================================
//  PROJE SOHBETİ
// =====================================================================
async function projeAc(id, gecmiseEkle = true){
  if (D.dm && id === D.dm.id){ history.replaceState({ sekme:'sohbet' }, '', location.pathname); return dmAc(); }
  let p = D.projeler.find(x => x.id === id);
  if (!p){ D.projeler = await D.api.projeler(); p = D.projeler.find(x => x.id === id); }
  if (!p) return tost('Proje bulunamadı');
  if (p.ozel){ D.dm = p; return dmAc(); }
  D.aktif = p; D.ekran = 'sohbet'; D.mesajlar = []; D.bekleyenDosya = null;
  if (gecmiseEkle) history.pushState({ proje:id }, '', '?proje=' + id);
  cizSohbet(false);
  await sohbetYukle(p);
}

// Birebir özel sohbet — uygulamanın ana ekranı
async function dmAc(){
  if (!D.dm){
    D.ekran = 'dm'; D.aktif = null;
    app.innerHTML = `<header class="ust"><div class="bosluk"><h1>Sohbet</h1></div></header>
      <div class="kaydir"><div class="bos"><div class="buyuk">⚙️</div><b>Özel sohbet bulunamadı</b><br>Supabase'de kurulum.sql dosyasını bir kez daha çalıştır (tekrar çalıştırmak güvenli).</div></div>
      ${sekmelerHTML('sohbet')}`;
    return sekmeleriBagla();
  }
  D.aktif = D.dm; D.ekran = 'dm'; D.mesajlar = []; D.bekleyenDosya = null;
  cizSohbet(true);
  await sohbetYukle(D.dm);
}

async function sohbetYukle(p){
  try {
    D.mesajlar = await D.api.mesajlar(p.id);
    if (D.aktif?.id !== p.id) return;
    cizMesajlar(true);
    await D.api.okundu(p.id);
    p.okunmamis = 0; rozetGuncelle(); sekmeRozetleri();
  } catch (e) { tost(hataMetni(e)); }
}

function baslikHTML(p){
  const d = DURUM[p.durum] || DURUM.devam;
  const yaziyor = D.yaziyorKim && D.yaziyorKim.proje === p.id;
  return `<b>${esc(p.ad)}</b><span>${yaziyor
    ? `<span class="durum-yazi canli">${esc(D.yaziyorKim.ad)} yazıyor<span class="yaziyor-nokta"><i></i><i></i><i></i></span></span>`
    : `<span class="durum-nokta" style="background:${d.renk}"></span>${d.ad}${p.linkler?.length ? ` · ${p.linkler.length} link` : ''}`}</span>`;
}
function dmBaslikHTML(){
  const ad = karsiAd(), canli = karsiCevrimici();
  const yaziyor = D.yaziyorKim && D.dm && D.yaziyorKim.proje === D.dm.id;
  return `<div class="avatar ${canli ? 'cevrimici' : ''}">${esc([...ad][0] || '?').toLocaleUpperCase('tr')}</div>
    <div class="sohbet-baslik" style="margin-left:2px"><b>${esc(ad)}</b>
      <span class="durum-yazi ${yaziyor || canli ? 'canli' : ''}">${yaziyor ? `yazıyor<span class="yaziyor-nokta"><i></i><i></i><i></i></span>` : canli ? 'çevrimiçi' : 'Özel sohbet · ikinize özel'}</span></div>`;
}
function basligiGuncelle(){
  if (D.ekran === 'dm'){ const b = document.getElementById('dm-baslik'); if (b) b.innerHTML = dmBaslikHTML(); return; }
  const b = document.getElementById('detay-btn'); if (b && D.aktif) b.innerHTML = baslikHTML(D.aktif);
}

function cizSohbet(dm){
  const p = D.aktif;
  app.innerHTML = `
  <header class="ust">
    ${dm
      ? `<div id="dm-baslik" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${dmBaslikHTML()}</div>
         <button class="ikon-btn" id="dosyalar-btn" aria-label="Paylaşılan dosyalar">${I.klasor}</button>
         <button class="ikon-btn" id="menu-btn" aria-label="Menü">${I.menu}</button>`
      : `<button class="ikon-btn" id="geri" aria-label="Geri">${I.geri}</button>
         <button class="sohbet-baslik" id="detay-btn">${baslikHTML(p)}</button>
         <button class="ikon-btn" id="bilgi-btn" aria-label="Proje bilgisi">${I.bilgi}</button>`}
  </header>
  <div class="kaydir" id="kaydir"><div class="mesajlar" id="mesajlar"><div class="bos"><div class="donen" style="margin:auto"></div></div></div></div>
  <div class="yazma ${dm ? 'sekmeli' : ''}">
    <div id="ek-alan"></div>
    <div class="yazma-satir">
      <button class="ekle" id="ekle-btn" aria-label="Dosya ekle">${I.ataç}</button>
      <input type="file" id="dosya" hidden>
      <textarea id="metin" rows="1" placeholder="Mesaj yaz…" enterkeyhint="${dokunmatik ? 'enter' : 'send'}"></textarea>
      <button class="gonder" id="gonder-btn" aria-label="Gönder">${I.gonder}</button>
    </div>
  </div>
  ${dm ? sekmelerHTML('sohbet') : ''}`;
  if (dm){
    sekmeleriBagla();
    document.getElementById('menu-btn').onclick = menuPanel;
    document.getElementById('dosyalar-btn').onclick = () => dosyalarPanel(D.dm, 'Paylaşılan dosyalar');
  } else {
    document.getElementById('geri').onclick = () => history.back();
    document.getElementById('detay-btn').onclick = document.getElementById('bilgi-btn').onclick = () => projePanel(D.aktif);
  }
  const metin = document.getElementById('metin');
  const taslak = sessionStorage.getItem('taslak-' + p.id); if (taslak) metin.value = taslak;
  const boyutla = () => { metin.style.height = 'auto'; metin.style.height = Math.min(metin.scrollHeight, 140) + 'px'; };
  let sonYaziyor = 0;
  metin.oninput = () => {
    boyutla(); sessionStorage.setItem('taslak-' + p.id, metin.value);
    if (metin.value && Date.now() - sonYaziyor > 2500){ sonYaziyor = Date.now(); D.api.yaziyor?.(p.id, D.ben.id); }
  };
  metin.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !dokunmatik && !e.isComposing){ e.preventDefault(); gonder(); } };
  // telefonda klavye açılınca alt sekmeleri gizle (yer açılsın)
  if (dokunmatik){
    metin.onfocus = () => document.body.classList.add('klavye');
    metin.onblur = () => setTimeout(() => document.body.classList.remove('klavye'), 80);
    // mesajlara dokununca / kaydırınca klavye kapansın, alt sekmeler geri gelsin
    document.getElementById('kaydir').addEventListener('touchstart', () => { if (document.activeElement === metin) metin.blur(); }, { passive:true });
  }
  boyutla();
  document.getElementById('gonder-btn').onclick = gonder;
  document.getElementById('gonder-btn').onmousedown = e => e.preventDefault(); // gönderince klavye kapanmasın
  document.getElementById('ekle-btn').onclick = () => document.getElementById('dosya').click();
  document.getElementById('dosya').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) dosyaSec(f); };
  // sürükle-bırak (bilgisayardan kullanırken)
  app.ondragover = e => e.preventDefault();
  app.ondrop = e => { e.preventDefault(); const f = e.dataTransfer?.files?.[0]; if (f && sohbetteMi()) dosyaSec(f); };
  // panodan görsel yapıştırma
  metin.onpaste = e => { const f = [...(e.clipboardData?.files || [])][0]; if (f){ e.preventDefault(); dosyaSec(f); } };
}

function dosyaSec(f){
  if (f.size > 50 * 1048576) return tost('Dosya çok büyük (en fazla 50 MB)');
  D.bekleyenDosya = f;
  const alan = document.getElementById('ek-alan');
  const onizleme = gorselMi(f.type) ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<div class="dosya" style="min-width:0;margin:0;padding:0;background:none"><div class="di">${esc(uzanti(f.name))}</div></div>`;
  alan.innerHTML = `<div class="ek-onizleme">${onizleme}<div class="ad"><b>${esc(f.name)}</b><br><small style="color:var(--soluk)">${boyut(f.size)}</small></div><button id="ek-kaldir" style="font-size:22px;color:var(--soluk);padding:0 6px" aria-label="Kaldır">×</button></div>`;
  document.getElementById('ek-kaldir').onclick = () => { D.bekleyenDosya = null; alan.innerHTML = ''; };
  document.getElementById('metin').focus();
}

async function gonder(){
  if (D.gonderiliyor) return;
  const kutu = document.getElementById('metin'), metin = kutu.value.trim(), dosya = D.bekleyenDosya, p = D.aktif;
  if (!metin && !dosya) return;
  D.gonderiliyor = true;
  const btn = document.getElementById('gonder-btn'); btn.disabled = true; btn.innerHTML = '<div class="donen"></div>';
  const gecici = { id:'gecici-' + Date.now(), proje_id:p.id, gonderen:D.ben.id, gonderen_ad:benimAdim(), metin,
    dosya_adi:dosya?.name, dosya_tipi:dosya?.type, dosya_boyut:dosya?.size, dosya_yolu: dosya ? 'yukleniyor' : null,
    olusturma:new Date().toISOString(), gonderiliyor:true };
  D.mesajlar.push(gecici); cizMesajlar(true);
  kutu.value = ''; kutu.style.height = 'auto'; sessionStorage.removeItem('taslak-' + p.id);
  D.bekleyenDosya = null; document.getElementById('ek-alan').innerHTML = '';
  try {
    const gercek = await D.api.mesajGonder(p.id, metin, dosya);
    D.mesajlar = D.mesajlar.filter(x => x.id !== gecici.id);
    if (!D.mesajlar.some(x => x.id === gercek.id)) D.mesajlar.push(gercek);
    D.mesajlar.sort((a, b) => new Date(a.olusturma) - new Date(b.olusturma));
    if (D.aktif?.id === p.id) cizMesajlar(true);
    listeYenile();
  } catch (e) {
    D.mesajlar = D.mesajlar.filter(x => x.id !== gecici.id);
    if (D.aktif?.id === p.id){ cizMesajlar(); kutu.value = metin; if (dosya) dosyaSec(dosya); }
    tost('Gönderilemedi: ' + hataMetni(e));
  } finally {
    D.gonderiliyor = false;
    const b = document.getElementById('gonder-btn'); if (b){ b.disabled = false; b.innerHTML = I.gonder; }
  }
}

function mesajHTML(m, onceki){
  const benim = m.gonderen === D.ben.id;
  const yeniGun = !onceki || gunAnahtar(onceki.olusturma) !== gunAnahtar(m.olusturma);
  const devam = !yeniGun && onceki && onceki.gonderen === m.gonderen && (new Date(m.olusturma) - new Date(onceki.olusturma)) < 5 * 6e4;
  let ek = '';
  if (m.dosya_yolu){
    if (m.dosya_yolu === 'yukleniyor') ek = `<div class="dosya"><div class="di"><div class="donen"></div></div><div><b>${esc(m.dosya_adi)}</b><small>Yükleniyor… ${boyut(m.dosya_boyut)}</small></div></div>`;
    else if (gorselMi(m.dosya_tipi)) ek = `<img class="gorsel" data-yol="${esc(m.dosya_yolu)}" alt="${esc(m.dosya_adi)}" loading="lazy">`;
    else ek = `<a class="dosya" data-yol="${esc(m.dosya_yolu)}" href="#" target="_blank" rel="noopener"><div class="di">${esc(uzanti(m.dosya_adi))}</div><div style="min-width:0"><b>${esc(m.dosya_adi)}</b><small>${boyut(m.dosya_boyut)}</small></div></a>`;
  }
  return `${yeniGun ? `<div class="gun">${gunBaslik(m.olusturma)}</div>` : ''}
  <div class="m ${benim ? 'benim' : ''} ${devam ? 'devam' : ''} ${m.gonderiliyor ? 'gonderiliyor' : ''}" data-id="${m.id}">
    ${!benim && !devam && !D.aktif?.ozel ? `<div class="kim">${esc(m.gonderen_ad)}</div>` : ''}
    <div class="balon">${ek}${m.metin ? linkle(m.metin) : ''}<span class="zaman">${m.gonderiliyor ? '⏳' : saat(m.olusturma)}</span></div>
  </div>`;
}

function cizMesajlar(enAlta = false){
  const kutu = document.getElementById('mesajlar'), kaydir = document.getElementById('kaydir');
  if (!kutu) return;
  const alttaydi = kaydir.scrollHeight - kaydir.scrollTop - kaydir.clientHeight < 120;
  if (!D.mesajlar.length){
    kutu.innerHTML = D.aktif.ozel
      ? `<div class="bos"><div class="buyuk">👋</div><b>${esc(karsiAd())} ile özel sohbetiniz</b><br>Burası sadece ikinize ait. İlk mesajı yaz!</div>`
      : `<div class="bos"><div class="buyuk">💬</div><b>${esc(D.aktif.ad)}</b><br>Bu projede ilk mesajı sen yaz.${D.aktif.aciklama ? `<br><br><span style="font-size:13.5px">${esc(D.aktif.aciklama)}</span>` : ''}</div>`;
    return;
  }
  kutu.innerHTML = D.mesajlar.map((m, i) => mesajHTML(m, D.mesajlar[i - 1])).join('');
  // dosya / görsel bağlantılarını doldur
  kutu.querySelectorAll('img.gorsel[data-yol]').forEach(async img => {
    try { img.src = await D.api.dosyaUrl(img.dataset.yol); } catch {}
    img.onload = () => { if (alttaydi || enAlta) kaydir.scrollTop = kaydir.scrollHeight; };
    img.onclick = () => buyut(img.src);
  });
  kutu.querySelectorAll('a.dosya[data-yol]').forEach(async a => { try { a.href = await D.api.dosyaUrl(a.dataset.yol); } catch {} });
  // kendi mesajını silme: bilgisayarda sağ tık, telefonda basılı tut
  kutu.querySelectorAll('.m.benim:not(.gonderiliyor)').forEach(el => {
    let zaman;
    const sor = () => mesajSilSor(el.dataset.id);
    el.oncontextmenu = e => { e.preventDefault(); sor(); };
    el.addEventListener('touchstart', () => { zaman = setTimeout(sor, 600); }, { passive:true });
    ['touchend', 'touchmove', 'touchcancel'].forEach(o => el.addEventListener(o, () => clearTimeout(zaman), { passive:true }));
  });
  if (enAlta || alttaydi) requestAnimationFrame(() => { kaydir.scrollTop = kaydir.scrollHeight; });
}

async function mesajSilSor(id){
  const m = D.mesajlar.find(x => x.id === id); if (!m) return;
  navigator.vibrate?.(15);
  if (!confirm('Bu mesaj ikiniz için de silinsin mi?')) return;
  try { await D.api.mesajSil(m); D.mesajlar = D.mesajlar.filter(x => x.id !== id); cizMesajlar(); listeYenile(); }
  catch (e) { tost(hataMetni(e)); }
}

function buyut(src){
  const d = document.createElement('div'); d.className = 'buyut';
  d.innerHTML = `<img src="${esc(src)}" alt="">`; d.onclick = () => d.remove();
  document.body.appendChild(d);
}

function panelAc(html, hazir){
  const perde = document.createElement('div'); perde.className = 'perde';
  perde.innerHTML = `<div class="panel" role="dialog"><div class="tutamak"></div>${html}</div>`;
  perde.onclick = e => { if (e.target === perde) kapat(); };
  const kapat = () => perde.remove();
  document.body.appendChild(perde);
  hazir?.(perde.querySelector('.panel'), kapat);
  return kapat;
}

function projePanel(p){
  const yeni = !p;
  let durum = p?.durum || 'devam';
  let linkler = [...(p?.linkler || [])];
  panelAc(`
    <h3>${yeni ? 'Yeni proje' : 'Proje bilgisi'}</h3>
    <div class="alan"><label>Proje adı</label><input class="girdi" id="p-ad" maxlength="80" value="${esc(p?.ad || '')}" placeholder="Örn: Web sitesi yenileme"></div>
    <div class="alan"><label>Durum</label><div class="secim" id="p-durum">
      ${Object.entries(DURUM).map(([k, v]) => `<button type="button" data-d="${k}" style="--renk:${v.renk}" class="${k === durum ? 'secili' : ''}"><span class="durum-nokta" style="background:${v.renk}"></span>${v.ad}</button>`).join('')}
    </div></div>
    <div class="alan"><label>Açıklama / notlar</label><textarea class="girdi" id="p-aciklama" rows="3" placeholder="Proje ne hakkında, hedef ne?">${esc(p?.aciklama || '')}</textarea></div>
    <div class="alan"><label>Linkler (GitHub, Drive, Figma, site…)</label>
      <div id="p-linkler"></div>
      <div class="iki"><input class="girdi" id="l-ad" placeholder="Ad" style="flex:0 0 32%"><input class="girdi" id="l-url" placeholder="https://…" inputmode="url"><button class="btn ikincil" id="l-ekle" type="button" style="flex:none;padding:0 14px">Ekle</button></div>
    </div>
    <button class="btn tam" id="p-kaydet" style="margin-top:6px">${yeni ? 'Projeyi oluştur' : 'Kaydet'}</button>
    ${yeni ? '' : `<h4>Paylaşılan dosyalar</h4><div class="dosya-liste" id="p-dosyalar"><small>Yükleniyor…</small></div>
      <button class="btn tehlike tam" id="p-sil" style="margin-top:22px">Projeyi sil</button>`}
  `, (panel, kapat) => {
    const linkCiz = () => {
      panel.querySelector('#p-linkler').innerHTML = linkler.map((l, i) =>
        `<div class="link-satir">🔗<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.ad || l.url)}</b></a><button data-sil="${i}" aria-label="Linki sil">×</button></div>`).join('');
      panel.querySelectorAll('[data-sil]').forEach(b => b.onclick = () => { linkler.splice(+b.dataset.sil, 1); linkCiz(); });
    };
    linkCiz();
    panel.querySelector('#l-ekle').onclick = () => {
      let url = panel.querySelector('#l-url').value.trim(); const ad = panel.querySelector('#l-ad').value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      linkler.push({ ad: ad || url.replace(/^https?:\/\/(www\.)?/, '').split('/')[0], url });
      panel.querySelector('#l-url').value = ''; panel.querySelector('#l-ad').value = ''; linkCiz();
    };
    panel.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      durum = b.dataset.d; panel.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('secili', x === b));
    });
    if (yeni) setTimeout(() => panel.querySelector('#p-ad').focus(), 250);
    panel.querySelector('#p-kaydet').onclick = async () => {
      const ad = panel.querySelector('#p-ad').value.trim();
      if (!ad) return panel.querySelector('#p-ad').focus();
      // yazılıp "Ekle"ye basılmamış link kalmasın
      const bekleyen = panel.querySelector('#l-url').value.trim(); if (bekleyen) panel.querySelector('#l-ekle').click();
      const veri = { ad, durum, aciklama: panel.querySelector('#p-aciklama').value.trim(), linkler };
      const b = panel.querySelector('#p-kaydet'); b.disabled = true;
      try {
        if (yeni){ const y = await D.api.projeEkle(veri); kapat(); D.projeler = await D.api.projeler(); projeAc(y.id); }
        else { await D.api.projeGuncelle(p.id, veri); Object.assign(D.aktif, veri); kapat(); basligiGuncelle(); listeYenile(); tost('Kaydedildi ✓'); }
      } catch (e) { b.disabled = false; tost(hataMetni(e)); }
    };
    if (!yeni){
      D.api.dosyalar(p.id).then(async ds => {
        const kutu = panel.querySelector('#p-dosyalar');
        if (!ds.length) return kutu.innerHTML = '<small>Bu projede henüz dosya paylaşılmadı.</small>';
        kutu.innerHTML = ds.map(d => `<a data-yol="${esc(d.dosya_yolu)}" href="#" target="_blank" rel="noopener">${gorselMi(d.dosya_tipi) ? '🖼️' : '📄'}<span>${esc(d.dosya_adi)}</span><small>${esc(d.gonderen_ad)} · ${kisaZaman(d.olusturma)}</small></a>`).join('');
        kutu.querySelectorAll('a[data-yol]').forEach(async a => { try { a.href = await D.api.dosyaUrl(a.dataset.yol); } catch {} });
      }).catch(() => {});
      panel.querySelector('#p-sil').onclick = async () => {
        if (!confirm(`"${p.ad}" projesi, içindeki tüm mesaj ve dosyalarla birlikte silinsin mi? Bu geri alınamaz.`)) return;
        try { await D.api.projeSil(p.id); kapat(); D.projeler = D.projeler.filter(x => x.id !== p.id); history.replaceState({ sekme:'projeler' }, '', location.pathname); cizListe(); tost('Proje silindi'); }
        catch (e) { tost(hataMetni(e)); }
      };
    }
  });
}

// =====================================================================
//  BİLDİRİMLER (push)
// =====================================================================
const b64Bayt = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function bildirimAc(){
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
      return alert(iOS && !kurulu
        ? "iPhone'da bildirim için önce uygulamayı ana ekrana eklemelisin:\nSafari → Paylaş → Ana Ekrana Ekle.\nSonra ana ekrandaki ikondan açıp bu düğmeye tekrar bas."
        : 'Bu tarayıcı bildirimleri desteklemiyor.');
    }
    const izin = await Notification.requestPermission();
    if (izin !== 'granted') return tost('Bildirim izni verilmedi');
    const kayit = await navigator.serviceWorker.ready;
    let abonelik = await kayit.pushManager.getSubscription();
    if (!abonelik) abonelik = await kayit.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64Bayt(AYAR.VAPID_PUBLIC_KEY) });
    await D.api.aboneOl(abonelik);
    tost('Bildirimler açık ✓');
  } catch (e) { tost('Bildirim açılamadı: ' + hataMetni(e)); }
}

// =====================================================================
//  ANLIK OLAYLAR (karşı taraf mesaj atınca, proje değişince)
// =====================================================================
function olay(tur, p){
  if (tur === 'baglandi'){ listeYenile(); return; }
  if (tur === 'varlik'){ D.cevrimici = new Set(p); if (D.ekran === 'dm') basligiGuncelle(); return; }
  if (tur === 'yaziyor'){
    if (!p || p.kim === D.ben.id) return;
    D.yaziyorKim = { proje:p.proje_id, ad:karsiAd() };
    if (sohbetteMi() && D.aktif?.id === p.proje_id) basligiGuncelle();
    clearTimeout(D.yaziyorZaman);
    D.yaziyorZaman = setTimeout(() => { D.yaziyorKim = null; if (sohbetteMi()) basligiGuncelle(); }, 4000);
    return;
  }
  if (tur === 'mesaj'){
    if (p.eventType === 'INSERT'){
      const m = p.new;
      if (m.gonderen !== D.ben.id && D.yaziyorKim?.proje === m.proje_id){ D.yaziyorKim = null; clearTimeout(D.yaziyorZaman); basligiGuncelle(); }
      if (sohbetteMi() && D.aktif?.id === m.proje_id){
        if (!D.mesajlar.some(x => x.id === m.id) && !(m.gonderen === D.ben.id && D.mesajlar.some(x => x.gonderiliyor))){
          D.mesajlar.push(m); cizMesajlar();
        }
        if (m.gonderen !== D.ben.id && !document.hidden) D.api.okundu(m.proje_id);
      } else if (m.gonderen !== D.ben.id){
        const proje = D.projeler.find(x => x.id === m.proje_id);
        const yer = proje && !proje.ozel ? ' · ' + proje.ad : '';
        tost(`💬 ${m.gonderen_ad}${yer}: ${m.metin || '📎 ' + (m.dosya_adi || 'dosya')}`.slice(0, 120), () => projeAc(m.proje_id));
        navigator.vibrate?.([30, 40, 30]);
      }
      listeYenile();
    } else if (p.eventType === 'DELETE'){
      if (D.mesajlar.some(x => x.id === p.old?.id)){ D.mesajlar = D.mesajlar.filter(x => x.id !== p.old.id); cizMesajlar(); }
      listeYenile();
    }
  }
  if (tur === 'proje'){
    if (D.ekran === 'sohbet' && D.aktif){
      if (p.eventType === 'DELETE' && p.old?.id === D.aktif.id){ tost('Bu proje silindi'); history.replaceState({ sekme:'projeler' }, '', location.pathname); cizListe(); }
      else if (p.eventType === 'UPDATE' && p.new?.id === D.aktif.id){
        // Sadece başlığı güncelle — yazma kutusuna dokunma (klavye kapanmasın)
        Object.assign(D.aktif, p.new); basligiGuncelle();
      }
    }
    listeYenile();
  }
}

// =====================================================================
//  BAŞLANGIÇ
// =====================================================================
async function basla(){
  try {
    const uyeler = await D.api.uyeler();
    D.adlar = Object.fromEntries(uyeler.map(u => [u.email.toLowerCase(), u.ad]));
    if (!D.adlar[(D.ben.email || '').toLowerCase()]){
      app.innerHTML = `<div class="giris"><div class="logo"></div><h2>Erişim yok</h2><p>Bu numara (${esc(telGoster(D.ben.email))}) tanımlı kişiler listesinde değil.</p><button class="btn ikincil" id="c">Çıkış yap</button></div>`;
      document.getElementById('c').onclick = async () => { await D.api.cikis(); location.reload(); };
      return;
    }
    D.projeler = await D.api.projeler();
    D.dm = D.projeler.find(p => p.ozel) || null;
  } catch (e) { tost(hataMetni(e)); }
  D.api.dinle(olay, D.ben.id);
  const acilacak = new URLSearchParams(location.search).get('proje');
  if (acilacak && acilacak !== D.dm?.id){
    // bildirimden bir projeye gelindiyse: geri tuşu Atölye listesine dönsün
    history.replaceState({ sekme:'projeler' }, '', location.pathname);
    cizListe(); projeAc(acilacak);
  } else {
    history.replaceState({ sekme:'sohbet' }, '', location.pathname);
    dmAc();   // açılışta direkt birebir sohbet
  }
}

window.addEventListener('popstate', e => {
  if (document.querySelector('.perde')) document.querySelectorAll('.perde').forEach(x => x.remove());
  if (!D.ben) return;
  if (e.state?.proje) projeAc(e.state.proje, false);
  else if (e.state?.sekme === 'sohbet') dmAc();
  else cizListe();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && D.ben){ listeYenile(); if (sohbetteMi() && D.aktif) D.api.okundu(D.aktif.id); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.kurulumIstegi = e; });

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.tip === 'ac' && e.data.proje && D.ben) projeAc(e.data.proje); });
}

(async () => {
  try {
    D.api = DEMO ? demoKatmani() : await supabaseKatmani();
  } catch (e) {
    app.innerHTML = `<div class="giris"><h2>Bağlanamadı</h2><p>${esc(hataMetni(e))}</p><button class="btn" onclick="location.reload()">Tekrar dene</button></div>`;
    return;
  }
  D.api.oturumDegisti((olayAdi, kullanici) => { if (olayAdi === 'SIGNED_OUT' && D.ben){ D.ben = null; cizGiris(); } });
  D.ben = await D.api.oturum();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search); // linkteki bilgileri adres çubuğundan temizle
  if (D.ben && (LINK_TURU === 'invite' || LINK_TURU === 'recovery')) cizSifreBelirle();
  else if (D.ben) await basla();
  else cizGiris();
})();
